[project]
name = "llm-group-count"
version = "0.1.0"
description = "Empirical study of LLM counting and aggregation abilities"
requires-python = ">=3.11"
dependencies = [
    "chatlas>=0.2.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]
