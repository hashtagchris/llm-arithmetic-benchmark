[project]
name = "llm-arithmetic-benchmark"
version = "0.1.0"
description = "Benchmark LLM accuracy at completing an arithmetic Markdown table"
requires-python = ">=3.11"
dependencies = [
    "chatlas>=0.2.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]
